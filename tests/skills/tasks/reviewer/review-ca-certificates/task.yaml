# natural-defect review: a cheap writer's slices file and spread test from the
# ca-certificates knockout, unedited. review-ca-certificates/key.yaml lists the defects.
prompt: |
  Use the chisel-slice-reviewer skill to review the proposed new package slices file `slices/ca-certificates.yaml` and its spread test, `tests/spread/integration/ca-certificates/`, for `ubuntu-24.04`.

  You are in a checkout of canonical/chisel-releases (your current directory). The proposed files are uncommitted changes in the working tree. Follow the skill's workflow and the conventions in its knowledge base.

  This is an automated eval: work autonomously, do not ask questions, and do not modify any files. Your final message is the review.
stage: stage --branch ubuntu-24.04 --review ca-certificates
timeout: 20m
