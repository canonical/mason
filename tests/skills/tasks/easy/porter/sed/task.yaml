# forward port that only changes the manifest format: checks the model doesn't
# over-edit.
# key.yaml holds the adaptations the port must make. the target's own slice
# (knocked out) is supporting evidence only.
prompt: |
  Use the chisel-slice-porter skill to port the chisel package slices file for `sed` from `ubuntu-24.04` to this checkout's release, `ubuntu-26.04`.

  You are in a checkout of canonical/chisel-releases on `ubuntu-26.04` (your current directory). The source release is available locally as the git branch `ubuntu-24.04`. Write the ported slices file to `slices/sed.yaml`, and port its spread test if the source has one. Follow the skill's workflow and the conventions in its knowledge base.

  This is an automated eval: work autonomously, do not ask questions, and do not open a PR. Produce the files and stop.
stage: stage --branch ubuntu-26.04 --source ubuntu-24.04 --knockout sed
collect: collect
timeout: 20m
