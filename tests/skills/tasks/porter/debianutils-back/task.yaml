# back port: 26.04's slice depends on fine-grained coreutils and dpkg slices
# that 24.04 doesn't have.
# key.yaml holds the adaptations the port must make. the target's own slice
# (knocked out) is supporting evidence only.
prompt: |
  Use the chisel-slice-porter skill to port the chisel package slices file for `debianutils` from `ubuntu-26.04` to this checkout's release, `ubuntu-24.04`.

  You are in a checkout of canonical/chisel-releases on `ubuntu-24.04` (your current directory). The source release is available locally as the git branch `ubuntu-26.04`. Write the ported slices file to `slices/debianutils.yaml`, and port its spread test if the source has one. Follow the skill's workflow and the conventions in its knowledge base.

  This is an automated eval: work autonomously, do not ask questions, and do not open a PR. Produce the files and stop.
stage: stage --branch ubuntu-24.04 --source ubuntu-26.04 --knockout debianutils
collect: collect
timeout: 20m
