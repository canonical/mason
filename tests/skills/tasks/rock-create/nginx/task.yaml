prompt: |
  Use the rock-create skill to build a rock for the nginx web server -- the `nginx` package from the Ubuntu archive -- on ubuntu@24.04, amd64 only. It runs nginx as a long-running service.

  This is an automated eval: work autonomously and do not ask questions -- defaults are fine for anything not stated above. Write `rockcraft.yaml` and its tests in the current directory, pack the rock, run its tests, and stop with the final report.
stage: stage --rock
prepare: | # inside the sandbox, as root: let the agent user drive lxd (rockcraft's builds and tests)
  snap wait system seed.loaded
  lxd waitready --timeout=120
  usermod -aG lxd pats
collect: collect --rock
timeout: 60m # a pack and a test run take minutes each
step-sandbox: steps # the pats snap runs no host steps
