# mason eval via pats 1.x (https://github.com/lczyk/pats). in tests/skills:
#   pats init     builds and pins the sandbox image
#   pats run      runs the agents (slow, live). keep -j at 4 or below for runs
#                 whose timings get compared: sandboxes share the cpus.
#   pats score    scores the latest run (offline)
# steps are shell scripts with bin/ on PATH, and read names from $PATS_*.

sandboxes:
  kind: sandbox
  defaults:
    provision: provision
    # task hosts only: pats adds each harness's own.
    egress:
      allow:
        - .ubuntu.com # apt mirrors, for deb-list
        - pypi.org # pyyaml for `uv run <helper>`
        - files.pythonhosted.org
        - github.com
        - raw.githubusercontent.com
        - codeload.github.com
        - api.github.com
        # docs agents read
        - manpages.debian.org
        - www.debian.org
        - wiki.debian.org
        - linux.die.net
        - www.kernel.org
        - lwn.net
      # chisel-releases holds the answers. a hit lands in the pair's metadata.json
      # as a cheat signal. orientation's `git ls-remote` (info/refs) and its raw
      # chisel.yaml fetches stay open; on raw only slices/ and tests/ are answers.
      # a glob's `*` stays in one path segment, so it pins the owner and leaves
      # e.g. chisel-docs/.../chisel-releases/ open; `**` takes all below.
      # objects.githubusercontent.com is not allowed: its paths can't be filtered by repo.
      deny:
        - .oaiusercontent.com # codex's own startup fetch, not the agent's
        - "github.com/*/chisel-releases"
        - "github.com/*/chisel-releases/**"
        - "github.com/*/chisel-releases.git"
        - "github.com/*/chisel-releases.git/git-upload-pack"
        - "raw.githubusercontent.com/*/chisel-releases/**/slices/**"
        - "raw.githubusercontent.com/*/chisel-releases/**/tests/**"
        - "codeload.github.com/*/chisel-releases"
        - "codeload.github.com/*/chisel-releases/**"
        - "api.github.com/repos/*/chisel-releases"
        - "api.github.com/repos/*/chisel-releases/**"
        # the numeric routes reach a repo by id: canonical's and any fork's,
        # with no name to filter on, so all of them.
        - "api.github.com/repositories/**"
  items:
    docker:
      driver: docker
    # sudo and nesting let an agent run spread tests in nested containers.
    # lxd:
    #   driver: lxd
    #   sudo: true
    #   config:
    #     security.nesting: "true"

# haiku and sonnet bracket the model range. codex-mini is a second harness.
models:
  kind: agent
  defaults:
    harness: claude-cli-keyless
    effort: low
    sandbox: docker
  items:
    haiku:
      model: claude-haiku-4-5-20251001
    sonnet:
      model: claude-sonnet-5
    codex-mini:
      harness: codex-cli-keyless
      model: gpt-5.6-luna

# chisel-slicer ablation: bin/stage reads the variant from the abl-<variant>
# name and bin/ablate removes its parts. full-2 is a second baseline sample.
ablation:
  kind: agent
  defaults:
    harness: opencode-openrouter
    model: deepseek/deepseek-v4.1-flash
    sandbox: docker
    max-cost: 2 # usd per pair: stops a runaway loop, not a normal pair
  items:
    abl-full:
    abl-full-2:
    abl-no-sdf-format:
    abl-no-conventions:
    abl-no-spread:
    abl-no-verification:
    abl-no-small-kb:
    abl-no-kb:

# one dir per task: task.yaml (the prompt inline) and any ground truth.
knockout: # the real slice is taken out and must be rewritten
  kind: task
  dir: tasks/knockout
denovo: # several targets from scratch, against silver files
  kind: task
  dir: tasks/denovo
refusal:
  kind: task
  dir: tasks/refusal
help:
  kind: task
  dir: tasks/help

# scorers/scorer_<name>.py, helpers in scorers/_lib.py. first stdout line: [0,1] or `na`.
slice-checks:
  kind: scorer
  defaults: &py-scorer
    score: scorers/scorer_"$PATS_SCORER_NAME".py
  items:
    target-present:
    yaml-parses:
    filename-matches-package:
    copyright-essential:
    mutate-present:
    mutate-paths:
    slice-count-not-inflated:
    structural-distance:
    chisel-cut:
    orientation-called:
    spread-test-present:
    spread-exercises-binaries:
    no-answer-fetch:
    hygiene: # the style and format checks, one vote (see its CHECKS)
refusal-checks:
  kind: scorer
  defaults: *py-scorer
  items:
    refuses-nonexistent:
    refusal-verified:
help-checks:
  kind: scorer
  defaults: *py-scorer
  items:
    usage-printed:
    mason-stops-clean:

suites:
  kind: suite
  defaults:
    agents: models
  items:
    slicer:
      tasks:
        - knockout
        - denovo
      scorers: slice-checks
    # slice-checks need ground truth, which refusal has none of.
    slicer-refusal:
      tasks: refusal
      scorers:
        - refusal-checks
        - orientation-called
    mason:
      tasks: help
      scorers: help-checks

# chisel-slicer ablation, billed per token: manual, so a bare `pats run`
# leaves it out. `pats run -S experiments` runs it. screening: one light and
# one heavy knockout, plus the refusal.
experiments:
  kind: suite
  defaults:
    agents: ablation
    manual: true
  items:
    ablation:
      tasks:
        - base-passwd
        - python3.14
      scorers: slice-checks
    ablation-refusal:
      tasks: refusal
      scorers:
        - refusal-checks
        - orientation-called
