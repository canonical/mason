version: 1
skill: chisel-slicer
summary: Cross-agent skill for authoring and reviewing chisel slice definition files (SDFs).

# shared reference material, one module per subject. each stands alone; a
# command reads the ones its steps call for. paths are relative to this
# skill's directory (the one holding SKILL.md) so the skill stays
# self-contained wherever it is installed.
shared:
  slice-definition-format:
    module: shared/slice-definition-format.md
    description: SDF format -- keys, content entry options, wildcards, mutate, arch-gated essentials, hint style, arch names.
  chisel-releases:
    module: shared/chisel-releases.md
    description: Branch model, per-branch layout, chisel.yaml schema versions.
  slice-conventions:
    module: shared/slice-conventions.md
    description: Canonical slice names and paths to exclude by default.
  cross-release-porting:
    module: shared/cross-release-porting.md
    description: Cross-release differences and multiarch quirks when forward-porting.
  spread-tests:
    module: shared/spread-tests.md
    description: Spread layout, install-slices, two-layer testing model, chroot patterns, backends.
  chisel-cli:
    module: shared/chisel-cli.md
    description: chisel CLI, --release semantics, inspecting the repo without a checkout.
  upstream-sources:
    module: shared/upstream-sources.md
    description: Upstream repos, doc page index, precedence when sources conflict.

commands:
  - name: write-slice
    file: commands/write-slice.md
    stage: active
    description: Author + test + commit chisel SDFs locally. Does not open PRs.
  - name: review-slice
    file: commands/review-slice.md
    stage: active
    description: Read-only review of SDFs against chisel conventions, CI checks, and forward-port rules.

futureCommands: []
