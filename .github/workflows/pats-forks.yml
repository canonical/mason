name: pats (forks)

# skill evals (tests/skills/pats.yaml) for prs from forks, whose own
# `pull_request` run gets no secrets. this one runs on `pull_request_target`:
# the workflow file is main's and the jobs can hold a key. the code under test
# is still the fork's, so the run job sits in the pats-forks environment until
# a maintainer approves it. a push to the pr is a new run, to approve again.
#
# the key has to be passed for the reusable workflow to see it. pats-forks has
# its own OPENROUTER_API_KEY, which wins over the repo's in the run job.

on:
  pull_request_target:
    # the list in pats.yml.
    paths:
      - skills/**
      - tests/skills/**
      - "!tests/skills/README.md"
      - .github/workflows/pats-forks.yml
      - .github/scripts/pats-suites.sh
      #

concurrency:
  group: pats-forks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # picks the ci suites the change needs, as in pats.yml. the checkout is
  # main's: the fork's files and pats.yaml are read as data only.
  plan:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suite-args: ${{ steps.plan.outputs.suite-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/tests/skills/pats.yaml?ref=$REF" > "$RUNNER_TEMP/pats.yaml"
          args="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' |
            bash .github/scripts/pats-suites.sh "$RUNNER_TEMP/pats.yaml")"
          echo "suites: ${args:-none}"
          printf 'suite-args=%s\n' "$args" >> "$GITHUB_OUTPUT"

  pats:
    needs: plan
    if: needs.plan.outputs.suite-args != ''
    uses: alesancor1/pats-action/.github/workflows/Pats.yaml@db3ef09cdd071eff2aea79d68a0d0c2c6eb9b342 # main
    permissions:
      contents: read
      pull-requests: write
    with:
      # on pull_request_target with an environment, the action checks out
      # the fork's head.
      environment: pats-forks
      working-directory: tests/skills
      pats-channel: latest/candidate
      run-args: ${{ needs.plan.outputs.suite-args }} -j -1
      score-args: ${{ needs.plan.outputs.suite-args }}
      max-regression: "0.1" # 10%
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
