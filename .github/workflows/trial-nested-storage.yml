name: trial nested storage

# throwaway trial, not for merging. rebuilds the layering of the rock-lxd
# sandbox on a runner (runner -> lxd container with nesting -> rockcraft's
# build instance) once per storage layout, and measures: where a pack's time
# goes, what an instance copy costs, and whether a copy with raw.idmap comes
# out shifted twice. no agent runs and no secret is used.
#
# read the results with: grep RESULT in each job's log.

on:
  pull_request:
    paths:
      - .github/workflows/trial-nested-storage.yml

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-26.04 # what the pats run job gets
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: dir, inner: dir} # what the sandbox has today
          - {host: btrfs, inner: dir}
          - {host: btrfs, inner: btrfs}
          - {host: zfs, inner: dir}
          - {host: zfs, inner: zfs}
    env:
      HOST: ${{ matrix.host }}
      INNER: ${{ matrix.inner }}
    steps:
      - name: lxd on the runner
        run: |
          uname -r
          df -h / /mnt 2> /dev/null || true
          if snap list lxd > /dev/null 2>&1; then sudo snap refresh lxd; else sudo snap install lxd; fi
          sudo snap set lxd daemon.group=adm
          sudo lxd waitready
          case "$HOST" in
            dir) sudo lxd init --auto --storage-backend=dir ;;
            btrfs) sudo lxd init --auto --storage-backend=btrfs --storage-create-loop=30 ;;
            zfs)
              sudo modprobe zfs || echo "RESULT case=$HOST-$INNER step=modprobe-zfs rc=1"
              sudo lxd init --auto --storage-backend=zfs --storage-create-loop=30
              ;;
          esac
          for br in lxdbr0 'patsbr+' patsup; do
            sudo iptables -I DOCKER-USER -i "$br" -j ACCEPT
            sudo iptables -I DOCKER-USER -o "$br" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          done
          snap list lxd
          lxc storage list
          lxc storage show default

      - name: sandbox
        run: |
          lxc init ubuntu:26.04 l1 -c security.nesting=true -c limits.cpu=2 -c limits.memory=6GiB < /dev/null
          if [ "$INNER" = zfs ]; then
            # hand the container its own dataset, for a pool of its own inside.
            lxc storage volume set default container/l1 zfs.delegate=true \
              || echo "RESULT case=$HOST-$INNER step=zfs-delegate rc=1"
          fi
          lxc start l1
          sleep 20
          lxc exec l1 -- cloud-init status --wait || true
          cat > l1.sh <<'EOF'
          set -u
          CASE="$1"
          INNER="$2"
          r() { echo "RESULT case=$CASE $*"; }
          export DEBIAN_FRONTEND=noninteractive

          echo "::group::provision, as tests/skills/bin/provision --rock"
          apt-get update -q
          apt-get install -y -q --no-install-recommends git snapd sudo
          snap wait system seed.loaded
          snap list lxd > /dev/null 2>&1 || snap install lxd
          lxd waitready --timeout=120
          snap install rockcraft --classic
          useradd -m -u 1001 pats 2> /dev/null || true
          agent="$(id -nu 1001)"
          snap set lxd daemon.group="$agent"
          systemctl restart snap.lxd.daemon.unix.socket snap.lxd.daemon
          lxd waitready --timeout=120
          echo "::endgroup::"

          echo "::group::inner pool: $INNER"
          findmnt -no FSTYPE,SOURCE /
          lxc network create lxdbr0
          case "$INNER" in
            dir) lxc storage create default dir ;;
            btrfs)
              # lxd makes the subvolume: one made beforehand it cannot inspect
              # from in here (btrfs subvolume list: operation not permitted).
              lxc storage create default btrfs source=/var/lib/nested-pool
              ;;
            zfs)
              ds="$(findmnt -no SOURCE / | sed 's/\[.*//')"
              ls -l /dev/zfs
              echo "dataset of this container: $ds"
              lxc storage create default zfs source="$ds/nested"
              ;;
          esac
          rc=$?
          r "step=pool rc=$rc"
          [ "$rc" = 0 ] || exit 0
          lxc profile device add default root disk path=/ pool=default
          lxc profile device add default eth0 nic network=lxdbr0 name=eth0
          lxc storage list
          echo "::endgroup::"

          # a second-level instance cannot load apparmor profiles, and snapd
          # dies trying. with no apparmor in sight it runs without.
          lxc profile set default raw.lxc 'lxc.mount.entry = tmpfs sys/kernel/security tmpfs rw,nosuid,nodev,noexec 0 0
          lxc.mount.entry = tmpfs sys/module/apparmor tmpfs ro,nosuid,nodev,noexec 0 0'

          echo "::group::copy with raw.idmap"
          owner() { lxc exec "$1" -- stat -c %u / < /dev/null; }
          s=$(date +%s)
          lxc image copy ubuntu:24.04 local: --alias noble < /dev/null
          r "step=image-download secs=$(($(date +%s) - s))"
          s=$(date +%s)
          lxc init noble ida -c raw.idmap="both 1001 0" < /dev/null
          r "step=init secs=$(($(date +%s) - s))"
          s=$(date +%s)
          lxc start ida < /dev/null
          r "step=start-original secs=$(($(date +%s) - s))"
          sleep 5
          r "step=original-root-owner uid=$(owner ida)"
          lxc stop ida < /dev/null
          s=$(date +%s)
          lxc copy ida idb < /dev/null
          r "step=copy secs=$(($(date +%s) - s))"
          s=$(date +%s)
          lxc start idb < /dev/null
          r "step=start-copy secs=$(($(date +%s) - s))"
          sleep 5
          # 0: the copy is fine. 1001: shifted a second time.
          r "step=copy-root-owner uid=$(owner idb)"
          lxc delete -f ida idb < /dev/null
          echo "::endgroup::"

          for d in /wa /wb; do
            mkdir -p "$d"
            printf '%s\n' "name: hello$(basename "$d")" "base: bare" "build-base: ubuntu@24.04" 'version: "2.10"' \
              "summary: hello" "description: hello" "run-user: _daemon_" "platforms:" "  amd64:" \
              "parts:" "  hello:" "    plugin: nil" "    stage-packages: [base-files_base, hello_bins]" \
              > "$d/rockcraft.yaml"
          done
          chown -R 1001:1001 /wa /wb
          cat > /opt/pack.sh <<'AGENT'
          # one pack as the agent: pack.sh <case> <tag> <dir>
          cd "$3" || exit 1
          rm -f ./*.rock
          s=$(date +%s)
          # through a pipe: straight into a file the output is lost here.
          timeout 1500 rockcraft pack -v 2>&1 | cat > pack.out
          rc=${PIPESTATUS[0]}
          echo "RESULT case=$1 step=pack-$2 secs=$(($(date +%s) - s)) rc=$rc rocks=$(ls ./*.rock 2> /dev/null | wc -l)"
          echo "::group::pack $2, full output"
          cat pack.out
          echo "::endgroup::"
          AGENT
          as_agent() {
            setpriv --reuid 1001 --regid 1001 --init-groups \
              /usr/bin/env "HOME=/home/$agent" "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin" \
              bash /opt/pack.sh "$CASE" "$@"
          }
          wipe() {
            for n in $(lxc list --project rockcraft --format csv -c n < /dev/null); do
              lxc delete -f --project rockcraft "$n" < /dev/null
            done
            lxc list --project rockcraft --format csv -c n < /dev/null | wc -l
          }

          # first with the id map rockcraft asks for, then privileged, which is
          # what the sandbox does today. each from nothing, so both are cold.
          as_agent mapped-cold /wa
          if ls /wa/*.rock > /dev/null 2>&1; then
            as_agent mapped-warm /wb
          fi
          wipe
          lxc profile set default security.privileged true
          as_agent privileged-cold /wa
          as_agent privileged-warm /wb
          lxc list --project rockcraft --format csv -c ns < /dev/null
          df -h / | tail -n 1
          EOF
          lxc file push l1.sh l1/root/l1.sh
          lxc exec l1 -- bash /root/l1.sh "$HOST-$INNER" "$INNER"
