name: diag nested lxd

# trial, not for merging: rebuilds the layering of the rock-lxd sandbox on a
# runner (runner -> lxd container with nesting -> rockcraft's build instance)
# and tries two fixes for a pack that fails there: the lxd socket handed to the
# agent's group, and apparmor hidden from rockcraft's build instances.

on:
  pull_request:
    paths:
      - .github/workflows/diag-nested-lxd.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-26.04 # what the pats run job gets
    timeout-minutes: 60
    steps:
      - name: runner
        run: |
          uname -r
          cat /proc/self/attr/current
          for f in .ns_level .ns_name .ns_stacked .stacked; do
            printf '%s = %s\n' "$f" "$(sudo cat /sys/kernel/security/apparmor/$f 2>&1)"
          done
          snap list

      # as pats-action's install.sh sets lxd up.
      - name: lxd on the runner
        run: |
          if snap list lxd > /dev/null 2>&1; then sudo snap refresh lxd; else sudo snap install lxd; fi
          sudo snap set lxd daemon.group=adm
          sudo lxd waitready
          sudo lxd init --auto
          for br in lxdbr0 'patsbr+' patsup; do
            sudo iptables -I DOCKER-USER -i "$br" -j ACCEPT
            sudo iptables -I DOCKER-USER -o "$br" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          done
          snap list lxd
          lxc info | grep -E 'kernel_version|server_version'
          lxc storage list

      - name: sandbox
        run: |
          lxc launch ubuntu:26.04 l1 -c security.nesting=true -c limits.cpu=2 -c limits.memory=6GiB < /dev/null
          sleep 20
          lxc exec l1 -- cloud-init status --wait || true
          cat > l1.sh <<'EOF'
          echo "::group::provision, as tests/skills/bin/provision --rock"
          apt-get update
          apt-get install -y --no-install-recommends git snapd
          snap wait system seed.loaded
          snap list lxd > /dev/null 2>&1 || snap install lxd
          lxd waitready --timeout=120
          lxd init --auto
          snap install rockcraft --classic
          snap list
          lxc storage list
          echo "::endgroup::"

          echo "::group::fix 1: the lxd socket goes to the agent's group"
          useradd -m -u 1001 pats 2> /dev/null || true
          agent="$(id -nu 1001)"
          id "$agent"
          snap set lxd daemon.group="$agent"
          systemctl restart snap.lxd.daemon.unix.socket snap.lxd.daemon
          lxd waitready --timeout=120
          ls -l /var/snap/lxd/common/lxd/unix.socket
          echo "::endgroup::"

          echo "::group::fix 2: build instances see no apparmor"
          lxc profile set default raw.lxc 'lxc.mount.entry = tmpfs sys/kernel/security tmpfs rw,nosuid,nodev,noexec 0 0
          lxc.mount.entry = tmpfs sys/module/apparmor tmpfs ro,nosuid,nodev,noexec 0 0'
          lxc profile show default
          echo "::endgroup::"

          rock() {
            printf '%s\n' "name: hello" "base: bare" "build-base: ubuntu@24.04" 'version: "2.10"' \
              "summary: hello" "description: hello" "run-user: _daemon_" "platforms:" "  amd64:" \
              "parts:" "  hello:" "    plugin: nil" "    stage-packages: [base-files_base, hello_bins]" \
              > "$1/rockcraft.yaml"
          }
          instances() {
            for i in $(lxc list --project rockcraft --format csv -c n); do
              echo "## $i"
              lxc start --project rockcraft "$i" 2> /dev/null
              sleep 3
              lxc exec --project rockcraft "$i" -- sh -c 'cat /proc/self/uid_map; ls -ldn / /root /root/snap; systemctl is-active snapd; journalctl -u snapd --no-pager | grep -i apparmor | tail -n 3'
            done
          }

          echo "::group::pack as the agent: uid 1001, no supplementary groups"
          mkdir -p /wa && rock /wa && chown -R 1001:1001 /wa
          cd /wa
          setpriv --reuid 1001 --regid 1001 --clear-groups \
            /usr/bin/env "HOME=/home/$agent" sh -c 'id; timeout 1200 rockcraft pack -v'
          echo "pack as agent: exit $?"
          ls -la /wa
          instances
          echo "::endgroup::"

          echo "::group::lxd alone: copy an instance whose root is mapped to uid 1001"
          show() {
            lxc exec "$1" -- sh -c 'cat /proc/self/uid_map; ls -ldn / /root /etc'
            ls -ldn "/var/snap/lxd/common/lxd/storage-pools/default/containers/$1/rootfs"
          }
          lxc init ubuntu:24.04 ida -c raw.idmap="both 1001 0" < /dev/null
          lxc start ida && sleep 8
          echo "## original"; show ida
          lxc stop ida
          lxc copy ida idb
          lxc start idb && sleep 8
          echo "## copy"; show idb
          lxc delete -f ida idb
          echo "::endgroup::"

          echo "::group::pack as root"
          for i in $(lxc list --project rockcraft --format csv -c n); do
            lxc delete -f --project rockcraft "$i"
          done
          mkdir -p /wr && rock /wr
          cd /wr
          timeout 1200 rockcraft pack -v
          echo "pack as root: exit $?"
          ls -la /wr
          instances
          echo "::endgroup::"
          EOF
          lxc file push l1.sh l1/root/l1.sh
          lxc exec l1 -- bash /root/l1.sh
