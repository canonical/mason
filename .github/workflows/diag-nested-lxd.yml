name: diag nested lxd

# trial, not for merging: rebuilds the layering of the rock-lxd sandbox on a
# runner (runner -> lxd container with nesting -> rockcraft's build instance)
# and tries the workarounds for a pack that fails there, as the agent runs it:
# uid 1001, no supplementary groups, no password for sudo.

on:
  pull_request:
    paths:
      - .github/workflows/diag-nested-lxd.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-26.04 # what the pats run job gets
    timeout-minutes: 75
    steps:
      # as pats-action's install.sh sets lxd up.
      - name: lxd on the runner
        run: |
          uname -r
          if snap list lxd > /dev/null 2>&1; then sudo snap refresh lxd; else sudo snap install lxd; fi
          sudo snap set lxd daemon.group=adm
          sudo lxd waitready
          sudo lxd init --auto
          for br in lxdbr0 'patsbr+' patsup; do
            sudo iptables -I DOCKER-USER -i "$br" -j ACCEPT
            sudo iptables -I DOCKER-USER -o "$br" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          done
          snap list lxd
          lxc storage list

      # is the second shift on copy a matter of nesting? the same steps on the
      # runner's own lxd, one level up.
      - name: copy with raw.idmap, not nested
        run: |
          echo "root:1001:1" | sudo tee -a /etc/subuid /etc/subgid
          sudo systemctl restart snap.lxd.daemon
          sudo lxd waitready
          show() {
            lxc exec "$1" -- sh -c 'cat /proc/self/uid_map; ls -ldn / /root /etc'
            sudo ls -ldn "/var/snap/lxd/common/lxd/storage-pools/default/containers/$1/rootfs"
          }
          lxc init ubuntu:24.04 ida -c raw.idmap="both 1001 0" < /dev/null
          lxc start ida && sleep 8
          echo "## original"; show ida
          lxc stop ida
          lxc copy ida idb
          lxc start idb && sleep 8
          echo "## copy"; show idb
          lxc delete -f ida idb

      - name: sandbox
        run: |
          lxc launch ubuntu:26.04 l1 -c security.nesting=true -c limits.cpu=2 -c limits.memory=6GiB < /dev/null
          sleep 20
          lxc exec l1 -- cloud-init status --wait || true
          cat > l1.sh <<'EOF'
          echo "::group::provision, as tests/skills/bin/provision --rock"
          apt-get update
          apt-get install -y --no-install-recommends git snapd sudo
          snap wait system seed.loaded
          snap list lxd > /dev/null 2>&1 || snap install lxd
          lxd waitready --timeout=120
          lxd init --auto
          snap install rockcraft --classic
          useradd -m -u 1001 pats 2> /dev/null || true
          agent="$(id -nu 1001)"
          id "$agent"
          echo "::endgroup::"

          echo "::group::workarounds"
          # 1: the agent has no supplementary groups, so the socket goes to its own.
          snap set lxd daemon.group="$agent"
          systemctl restart snap.lxd.daemon.unix.socket snap.lxd.daemon
          lxd waitready --timeout=120
          ls -l /var/snap/lxd/common/lxd/unix.socket
          # 2: a second-level instance cannot load apparmor profiles, and snapd
          # dies trying. with no apparmor in sight it runs without.
          lxc profile set default raw.lxc 'lxc.mount.entry = tmpfs sys/kernel/security tmpfs rw,nosuid,nodev,noexec 0 0
          lxc.mount.entry = tmpfs sys/module/apparmor tmpfs ro,nosuid,nodev,noexec 0 0'
          # 3: lxd shifts a copied instance's files twice when its root is
          # mapped to a user, which is what rockcraft sets up for anyone but
          # root. so rockcraft runs as root, whoever calls it.
          printf '%s ALL=(root) NOPASSWD: /snap/bin/rockcraft\n' "$agent" > /etc/sudoers.d/rockcraft
          chmod 0440 /etc/sudoers.d/rockcraft
          printf '%s\n' '#!/bin/sh' 'exec sudo -n /snap/bin/rockcraft "$@"' > /usr/local/bin/rockcraft
          chmod 0755 /usr/local/bin/rockcraft
          chmod 0755 /root # its logs, for the caller to read
          echo "::endgroup::"

          mkdir -p /wa
          printf '%s\n' "name: hello" "base: bare" "build-base: ubuntu@24.04" 'version: "2.10"' \
            "summary: hello" "description: hello" "run-user: _daemon_" "platforms:" "  amd64:" \
            "parts:" "  hello:" "    plugin: nil" "    stage-packages: [base-files_base, hello_bins]" \
            > /wa/rockcraft.yaml
          chown -R 1001:1001 /wa
          cat > /root/agent.sh <<'AGENT'
          cd /wa
          id
          echo "rockcraft is: $(command -v rockcraft)"
          echo "::group::pack as the agent"
          timeout 1200 rockcraft pack -v > pack.out 2>&1
          echo "pack as agent: exit $?"
          tail -n 6 pack.out
          ls -la /wa
          log="$(sed -n "s/^Logging execution to '\(.*\)'$/\1/p" pack.out | head -n1)"
          echo "log: $log"
          head -c 200 "$log" > /dev/null && echo "log readable by the agent: yes" || echo "log readable by the agent: no"
          lxc list --project rockcraft --format csv -c ns
          echo "::endgroup::"

          echo "::group::test as the agent"
          mkdir /wa/scaf && cd /wa/scaf && rockcraft init --profile=test --name hello > /dev/null 2>&1
          cd /wa
          sed '/^project:/,+1d' scaf/spread.yaml > rockcraft-test.yaml
          cp -R scaf/spread spread
          sudo -n /snap/bin/rockcraft --version
          rm -rf scaf 2> /dev/null || echo "scaf left behind: root owns it"
          cat rockcraft-test.yaml
          find spread -type f
          timeout 1500 rockcraft test > test.out 2>&1
          echo "test as agent: exit $?"
          tail -n 40 test.out
          echo "::endgroup::"
          AGENT
          setpriv --reuid 1001 --regid 1001 --clear-groups \
            /usr/bin/env "HOME=/home/$agent" "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin" \
            bash /root/agent.sh
          EOF
          lxc file push l1.sh l1/root/l1.sh
          lxc exec l1 -- bash /root/l1.sh
