name: pats

# skill evals (tests/skills/pats.yaml) via alesancor1/pats-action. on prs this
# runs the ci suites the change needs on the pr head and on the base branch,
# comments the score delta, and fails on a regression larger than
# max-regression. pinned to a pats-action commit; bump it to pick up changes.

on:
  pull_request:
    # what can move the score: the skills stage copies in, and the eval.
    # pats-forks.yml keeps the same list.
    paths:
      - skills/**
      - tests/skills/**
      - "!tests/skills/README.md"
      - .github/workflows/pats.yml
      - .github/scripts/pats-suites.sh
      #
  workflow_dispatch:

concurrency:
  group: pats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # picks the ci suites the change needs. none: no pats run, no approval.
  plan:
    # a pr from a fork gets no secrets, so its run could only fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suite-args: ${{ steps.plan.outputs.suite-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/tests/skills/pats.yaml?ref=$REF" > "$RUNNER_TEMP/pats.yaml"
          if [ -n "$PR" ]; then
            args="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' |
              bash .github/scripts/pats-suites.sh "$RUNNER_TEMP/pats.yaml")"
          else
            args="$(bash .github/scripts/pats-suites.sh "$RUNNER_TEMP/pats.yaml" --all)"
          fi
          echo "suites: ${args:-none}"
          printf 'suite-args=%s\n' "$args" >> "$GITHUB_OUTPUT"

  pats:
    needs: plan
    if: needs.plan.outputs.suite-args != ''
    # TODO: back to alesancor1/pats-action once the fork's branch lands there
    # (https://github.com/alesancor1/pats-action/pull/1).
    uses: lczyk/pats-action/.github/workflows/Pats.yaml@82e6d1f25ff1ac9dba8f39555d5147b17673a01c # feat/pull-request-target
    permissions:
      contents: read
      pull-requests: write
    with:
      # a pr run waits for a maintainer, so a push alone spends nothing. a
      # manual dispatch is that choice already.
      environment: ${{ github.event_name == 'pull_request' && 'pats-in-repo' || '' }}
      working-directory: tests/skills
      pats-channel: latest/candidate
      run-args: ${{ needs.plan.outputs.suite-args }} -j -1
      score-args: ${{ needs.plan.outputs.suite-args }}
      max-regression: "0.1" # 10%
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
