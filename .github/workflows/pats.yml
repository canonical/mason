name: pats

# skill evals (tests/skills/pats.yaml) via alesancor1/pats-action. on prs this
# runs the suite on the pr head and on the base branch, comments the score
# delta, and fails on a regression larger than max-regression.
# pinned to a pats-action commit; bump it to pick up changes.

on:
  pull_request:
    # what can move the score: the skills stage copies in, and the eval.
    # pats-forks.yml keeps the same list.
    paths:
      - skills/**
      - tests/skills/**
      - "!tests/skills/README.md"
      - .github/workflows/pats.yml
      #
  workflow_dispatch:

concurrency:
  group: pats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pats:
    # a pr from a fork gets no secrets, so its run could only fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # TODO: back to alesancor1/pats-action once the fork's branch lands there
    # (https://github.com/alesancor1/pats-action/pull/1).
    uses: lczyk/pats-action/.github/workflows/Pats.yaml@518c890d2e0fb0792fe489249e7966dfc2cc5e3f # feat/pull-request-target
    permissions:
      contents: read
      pull-requests: write
    with:
      # a pr run waits for a maintainer, so a push alone spends nothing. a
      # manual dispatch is that choice already.
      environment: ${{ github.event_name == 'pull_request' && 'pats-in-repo' || '' }}
      working-directory: tests/skills
      pats-channel: latest/candidate
      run-args: -S slicer-ci -j -1
      score-args: -S slicer-ci
      max-regression: "0.1" # 10%
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
